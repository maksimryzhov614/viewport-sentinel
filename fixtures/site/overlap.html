<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Overlap fixture</title>
    <style>
      body {
        margin: 0;
      }

      #mobile-cover {
        display: none;
      }

      @media (max-width: 480px) {
        #checkout {
          box-sizing: border-box;
          position: absolute;
          left: 60px;
          top: 300px;
          width: 200px;
          height: 40px;
        }

        #mobile-cover {
          display: block;
          position: fixed;
          left: 60px;
          top: 322px;
          width: 200px;
          height: 18px;
          z-index: 1;
          background: #1f2937;
        }
      }
    </style>
  </head>
  <body>
    <button id="checkout" type="button">Checkout</button>
    <div id="mobile-cover" class="cover"></div>
  </body>
</html>
