name: Verified demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Start fixture and wait for readiness
        run: |
          npm run fixture > /tmp/viewport-sentinel-fixture.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/clean >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/viewport-sentinel-fixture.log
          exit 1
      - name: Run seeded failing audit
        uses: ./
        with:
          config: tests/fixtures/config/golden.json
          output: artifacts/demo
