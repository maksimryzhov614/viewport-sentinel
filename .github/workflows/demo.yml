name: Verified demo
run-name: Verified demo [${{ inputs.nonce }}]

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Unique dispatch nonce
        required: true
        type: string

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Start fixture and wait for readiness
        run: |
          npm run fixture > /tmp/viewport-sentinel-fixture.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/clean >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/viewport-sentinel-fixture.log
          exit 1
      - id: audit
        name: Run seeded expected-findings audit
        continue-on-error: true
        uses: ./
        with:
          config: tests/fixtures/config/golden.json
          output: artifacts/demo
      - name: Upload proof reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: viewport-sentinel-demo-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo
          if-no-files-found: error
      - name: Assert expected findings
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          FINDING_COUNT: ${{ steps.audit.outputs.finding-count }}
          REPORT_JSON: ${{ steps.audit.outputs.report-json }}
          REPORT_SARIF: ${{ steps.audit.outputs.report-sarif }}
        run: |
          test "$AUDIT_OUTCOME" = "failure"
          test "$FINDING_COUNT" = "6"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const json = JSON.parse(readFileSync(process.env.REPORT_JSON, "utf8"));
            const sarif = JSON.parse(readFileSync(process.env.REPORT_SARIF, "utf8"));
            if (json.tool?.version !== "0.1.1" || json.complete !== true ||
                json.combinations?.completed !== 10 || json.combinations?.total !== 10 ||
                json.totals?.findingCount !== 6 || sarif.version !== "2.1.0" ||
                sarif.runs?.[0]?.results?.length !== 6) process.exit(1);
          '
