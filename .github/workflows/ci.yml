name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run generated:check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run verify:determinism -- 3
      - run: npm run verify:performance
      - run: npm pack --dry-run
      - run: npm run generated:check
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: artifacts/
          if-no-files-found: ignore

  self-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run generated:check
      - name: Start fixture and wait for readiness
        run: |
          npm run fixture > /tmp/viewport-sentinel-fixture.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/clean >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/viewport-sentinel-fixture.log
          exit 1
      - name: Consume the local Action
        uses: ./
        with:
          config: tests/fixtures/config/clean.json
          output: artifacts/self-consumer
